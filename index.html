<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Título de la pestaña -->
    <title>Un regalo con mucho cariño para mi querida milita</title>

    <!-- Icono de la pestaña (Favicon) y Favoritos -->
    <link rel="icon" type="image/png" href="./fav.png">
    <link rel="apple-touch-icon" href="./fav.png">

    <!-- Meta etiquetas Open Graph (Para el Embed de WhatsApp, Discord, IG) -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Un regalo con mucho cariño para mi querida milita">
    <meta property="og:description" content="Diseñé este pequeño rincón en internet especialmente para ti ✨">
    <meta property="og:image" content="https://6onnne.github.io/milita/fav.png">
    <meta property="og:url" content="https://6onnne.github.io/milita/">
    <meta name="theme-color" content="#f43f5e">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome para Iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        romantic: ['"Dancing Script"', 'cursive'],
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <style>
        /* Desactivar selección de texto en toda la página */
        * {
            -webkit-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        /* Quita márgenes y oculta barra de scroll */
        html, body {
            margin: 0 !important;
            padding: 0 !important;
            width: 100%;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        html::-webkit-scrollbar,
        body::-webkit-scrollbar {
            display: none;
        }

        /* Fondo para Celulares */
        body {
            background-image: url('./fondo-celu.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
        }

        /* Fondo para Computadores */
        @media (min-width: 768px) {
            body {
                background-image: url('./fondo-compuu.png');
            }
        }

        /* Contorno blanco para legibilidad */
        .text-outline-white {
            text-shadow: 
                2px  2px 0px #ffffff,
               -2px -2px 0px #ffffff,
                2px -2px 0px #ffffff,
               -2px  2px 0px #ffffff,
                0px  2px 4px rgba(255, 255, 255, 0.9);
        }

        /* Estilos 3D */
        .perspective-1000 {
            perspective: 1000px;
        }
        .transform-style-3d {
            transform-style: preserve-3d;
        }
        .backface-hidden {
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }
        .rotate-y-180 {
            transform: rotateY(180deg);
        }

        /* Canvas fijado al fondo */
        #particles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 1;
        }
    </style>
</head>
